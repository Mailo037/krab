[package]
name = "krab"
version = "0.5.0"
edition = "2021"
description = "Krab - a lightweight snipping tool that opens in milliseconds"
license = "MIT"
repository = "https://github.com/Mailo037/krab"
readme = "README.md"
keywords = ["screenshot", "snipping-tool", "screen-capture", "annotation"]
categories = ["multimedia::images", "command-line-utilities"]
default-run = "krab"

[lib]
name = "krab"
path = "src/lib.rs"

[[bin]]
name = "krab"
path = "src/main.rs"

[dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2"
bytemuck = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
open = "5"
interprocess = "2"
rqrr = "0.10"
sha2 = { version = "0.10", default-features = false }
global-hotkey = "0.7"

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_Storage_Xps",
] }
windows = { version = "0.61", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[target.'cfg(not(windows))'.dependencies]
xcap = "0.9"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.21"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints.clippy]
type_complexity = "allow"
# `as_chunks` would raise the minimum supported Rust version for no gain.
chunks_exact_to_as_chunks = "allow"
manual_checked_ops = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
