name: Release

# Push a tag like v0.2.0 to build the downloads and publish a release.
# The tag must match the version in Cargo.toml: installed copies compare the
# two to decide whether to update themselves.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/krab.exe, README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath krab-windows-x64.zip
          # The bare executable is what the built-in updater downloads.
          Copy-Item target/release/krab.exe krab-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: krab-windows-x64
          path: |
            krab-windows-x64.zip
            krab-windows-x64.exe

  macos:
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build both architectures
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Package universal binary
        run: |
          mkdir dist
          lipo -create -output dist/krab \
            target/aarch64-apple-darwin/release/krab \
            target/x86_64-apple-darwin/release/krab
          # Ad-hoc signature for the combined binary (required on Apple silicon).
          codesign --force --sign - dist/krab
          dist/krab --version
          cp README.md LICENSE dist/
          tar -czf krab-macos-universal.tar.gz -C dist .
          cp dist/krab krab-macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: krab-macos-universal
          path: |
            krab-macos-universal.tar.gz
            krab-macos-universal

  linux:
    needs: check-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir dist
          cp target/release/krab README.md LICENSE dist/
          cp assets/icon.png dist/krab.png
          tar -czf krab-linux-x86_64.tar.gz -C dist .
          cp target/release/krab krab-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: krab-linux-x86_64
          path: |
            krab-linux-x86_64.tar.gz
            krab-linux-x86_64

  publish:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: |
          sha256sum krab-windows-x64.zip krab-windows-x64.exe \
            krab-macos-universal.tar.gz krab-macos-universal \
            krab-linux-x86_64.tar.gz krab-linux-x86_64 > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            krab-windows-x64.zip
            krab-windows-x64.exe
            krab-macos-universal.tar.gz
            krab-macos-universal
            krab-linux-x86_64.tar.gz
            krab-linux-x86_64
            SHA256SUMS
