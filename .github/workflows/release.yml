name: Release

# Push a tag like v0.1.0 to build the downloads and publish a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/krab.exe, README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath krab-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: krab-windows-x64
          path: krab-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build both architectures
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Package universal binary
        run: |
          mkdir dist
          lipo -create -output dist/krab \
            target/aarch64-apple-darwin/release/krab \
            target/x86_64-apple-darwin/release/krab
          cp README.md LICENSE dist/
          tar -czf krab-macos-universal.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: krab-macos-universal
          path: krab-macos-universal.tar.gz

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir dist
          cp target/release/krab README.md LICENSE dist/
          cp assets/icon.png dist/krab.png
          tar -czf krab-linux-x86_64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: krab-linux-x86_64
          path: krab-linux-x86_64.tar.gz

  publish:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            krab-windows-x64.zip
            krab-macos-universal.tar.gz
            krab-linux-x86_64.tar.gz
